<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habesha Bingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --accent-color: #48cae4;
      --btn-green: #06d6a0;
      --btn-blue: #00b4d8;
      --text-color: #ffffff;
      --orange-btn: #ffb703;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 15px;
      background: #1c2541;
      border-bottom: 2px solid #3a506b;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
      color: var(--orange-btn);
    }

    .container {
      padding: 15px;
      flex: 1;
    }

    /* Stake Card */
    .stake-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #3a506b;
      text-align: center;
    }

    .stake-title {
      font-size: 16px;
      margin-bottom: 12px;
      color: #cbd5e1;
    }

    .btn-stake {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .btn-stake-10 { background-color: var(--btn-green); }
    .btn-stake-20 { background-color: var(--btn-blue); }

    /* Stats Box */
    .stats-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      border: 1px solid #3a506b;
    }

    .stat-item {
      margin: 12px 0;
    }

    .stat-number {
      font-size: 22px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .stat-label {
      font-size: 12px;
      color: #94a3b8;
    }

    /* Bottom Navigation */
    .nav-bar {
      display: flex;
      justify-content: space-around;
      background: #1c2541;
      padding: 10px 0;
      border-top: 1px solid #3a506b;
    }

    .nav-item {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      text-decoration: none;
    }

    .nav-item.active {
      color: var(--accent-color);
    }

    .nav-icon {
      font-size: 20px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Welcome to Habesha Bingo</h1>
  </div>

  <div class="container">
    <!-- Stake Selection -->
    <div class="stake-box">
      <div class="stake-title">▶ Choose Your Stake</div>
      <button class="btn-stake btn-stake-10" onclick="selectStake(10)">▷ Play 10</button>
      <button class="btn-stake btn-stake-20" onclick="selectStake(20)">▷ Play 20</button>
    </div>

    <!-- Active Statistics -->
    <div class="stats-card">
      <div class="stat-item">
        <div class="stat-number">45,000+</div>
        <div class="stat-label">Active Players</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">60,000+</div>
        <div class="stat-label">Games Played</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">500+</div>
        <div class="stat-label">Winners Daily</div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Menu -->
  <div class="nav-bar">
    <a href="#" class="nav-item active">
      <span class="nav-icon">🎮</span> Game
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">📜</span> History
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">👛</span> Wallet
    </a>
    <a href="#" class="nav-item">
      <span class="nav-icon">👤</span> Profile
    </a>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    function selectStake(amount) {
      alert("Stake " + amount + " ተመርጧል!");
    }
  </script>
</body>
</html>

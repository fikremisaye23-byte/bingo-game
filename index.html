<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --accent-color: #48cae4;
            --btn-green: #06d6a0;
            --btn-blue: #00b4d8;
            --text-color: #ffffff;
            --orange-btn: #ffb703;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            margin: 0;
        }
        h2 { color: var(--accent-color); margin-bottom: 10px; }
        .card-container {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stake-btns, .action-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        .btn-10 { background-color: var(--btn-blue); }
        .btn-20 { background-color: var(--orange-btn); color: #000; }
        .btn-play { background-color: var(--btn-green); width: 100%; font-size: 16px; margin-top: 10px;}
        
        input[type="number"] {
            padding: 8px;
            width: 120px;
            border-radius: 6px;
            border: 1px solid #ccc;
            text-align: center;
            font-size: 16px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            font-size: 13px;
            color: #adb5bd;
            margin: 15px 0;
        }
        .footer-nav {
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 13px;
        }
        .footer-nav span { cursor: pointer; }
    </style>
</head>
<body>

    <h2>🎮 Habesha Bingo</h2>

    <div class="card-container">
        <p><b>▶ Choose Your Stake (ውርርድ ይምረጡ)</b></p>
        <div class="stake-btns">
            <button class="btn-10" onclick="setStake(10)">Play 10 ብር</button>
            <button class="btn-20" onclick="setStake(20)">Play 20 ብር</button>
        </div>
        <p id="selected-stake" style="color: var(--btn-green); font-weight: bold;">የተመረጠው ውርርድ: 10 ብር</p>
    </div>

    <div class="card-container">
        <p><b>🎟️ ከ 1 - 600 ካርዶች ውስጥ 2 ካርድ ይምረጡ</b></p>
        <div class="action-btns">
            <div>
                <label>1ኛው ካርድ (1-600):</label><br>
                <input type="number" id="card1" min="1" max="600" placeholder="ምሳሌ: 45">
            </div>
            <div>
                <label>2ኛው ካርድ (1-600):</label><br>
                <input type="number" id="card2" min="1" max="600" placeholder="ምሳሌ: 320">
            </div>
        </div>
        <button class="btn-play" onclick="startCardGame()">ጨዋታውን ጀምር 🚀</button>
    </div>

    <div class="stats">
        <div>👥 <b>45,000+</b><br>Active Players</div>
        <div>🎮 <b>60,000+</b><br>Games Played</div>
        <div>🏆 <b>500+</b><br>Winners Daily</div>
    </div>

    <div class="footer-nav">
        <span onclick="alert('Game Section')">🎮 Game</span>
        <span onclick="alert('History Section')">📜 History</span>
        <span onclick="alert('Wallet Section')">👛 Wallet</span>
        <span onclick="alert('Profile Section')">👤 Profile</span>
    </div>

    <script>
        let currentStake = 10;

        function setStake(amount) {
            currentStake = amount;
            document.getElementById("selected-stake").innerText = `የተመረጠው ውርርድ: ${amount} ብር`;
        }

        function startCardGame() {
            let c1 = parseInt(document.getElementById("card1").value);
            let c2 = parseInt(document.getElementById("card2").value);

            if(!c1 || !c2) {
                alert("እባክዎ ከ 1 እስከ 600 ያሉት ሁለቱን የካርድ ቁጥሮች ያስገቡ!");
                return;
            }

            if(c1 < 1 || c1 > 600 || c2 < 1 || c2 > 600) {
                alert("የመረጧቸው የካርድ ቁጥሮች ከ 1 እስከ 600 ብቻ መሆን አለባቸው!");
                return;
            }

            if(c1 === c2) {
                alert("እባክዎ ሁለት የተለያዩ ካርዶችን ይምረጡ!");
                return;
            }

            alert(`በተሳካ ሁኔታ በ ${currentStake} ብር ውርርድ፦\nካርድ ቁጥር #${c1} እና ካርድ ቁጥር #${c2} ተመርጠዋል! መልካም እድል! 🎲`);
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: white;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 320px;
            margin: 20px auto;
        }
        .cell {
            width: 55px;
            height: 55px;
            background-color: #1f1f1f;
            border: 2px solid #0088cc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }
        .cell.selected {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🎯 Bingo Game</h2>
    <p>Tap numbers to mark them!</p>

    <div class="grid" id="bingoCard"></div>

    <button class="btn" onclick="checkBingo()">BINGO! 🎉</button>

    <script>
        const card = document.getElementById('bingoCard');
        
        for (let i = 1; i <= 25; i++) {
            let cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = Math.floor(Math.random() * 15) + ((i % 5) * 15) + 1;
            cell.onclick = function() {
                this.classList.toggle('selected');
            };
            card.appendChild(cell);
        }

        function checkBingo() {
            alert("Bingo Claimed!");
        }
    </script>
</body>
</html>
